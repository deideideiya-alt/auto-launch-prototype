<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>海外媒资 · 自动栏目工作台</title>
<style>
  :root{
    --bg:#f5f6f8;
    --surface:#ffffff;
    --surface-2:#fafbfc;
    --border:#e6e8ec;
    --border-strong:#d4d8de;
    --text:#1f2733;
    --text-2:#5b6573;
    --text-3:#8a94a3;
    --accent:#0d9488;
    --accent-d:#0b7d73;
    --accent-soft:#e6f4f2;
    --amber:#b45309; --amber-bg:#fef3c7;
    --blue:#1d6fb8;  --blue-bg:#e1effa;
    --green:#1a7f4b; --green-bg:#e3f5ea;
    --gray:#5b6573;  --gray-bg:#eef0f3;
    --red:#c0392b;   --red-bg:#fbe7e4;
    --radius:10px;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
    --shadow-pop:0 8px 28px rgba(16,24,40,.14);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--text);
    font-size:13px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;}
  .app{display:flex;flex-direction:column;min-height:100vh;}

  /* Header */
  .app-header{
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:0 24px;
    height:56px;
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:30;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .logo{
    width:28px;height:28px;border-radius:7px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;color:#fff;
  }
  .brand .title{font-size:15px;font-weight:650;letter-spacing:.2px;}
  .brand .sub{font-size:12px;color:var(--text-3);font-weight:500;margin-left:2px;}
  .header-meta{display:flex;align-items:center;gap:18px;color:var(--text-2);font-size:12px;}
  .header-meta .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px;vertical-align:middle;}
  .avatar{width:30px;height:30px;border-radius:50%;background:#dfe3ea;display:flex;align-items:center;justify-content:center;color:var(--text-2);font-weight:600;font-size:12px;}

  /* Top tabs */
  .top-tabs{
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:0 24px;
    display:flex;gap:4px;align-items:stretch;
    position:sticky;top:56px;z-index:20;
  }
  .top-tab{
    padding:12px 16px;font-size:13px;font-weight:600;color:var(--text-2);
    border:none;background:none;position:relative;border-bottom:2px solid transparent;
  }
  .top-tab:hover{color:var(--text);}
  .top-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .top-tab .cnt{
    margin-left:6px;font-size:11px;font-weight:600;color:var(--text-3);
    background:var(--gray-bg);padding:1px 7px;border-radius:10px;
  }
  .top-tab.active .cnt{background:var(--accent-soft);color:var(--accent-d);}

  .content{padding:18px 24px 60px;max-width:1480px;width:100%;margin:0 auto;}

  /* Region tabs */
  .section-label{font-size:12px;font-weight:600;color:var(--text-3);margin:6px 2px 8px;display:flex;align-items:center;gap:8px;}
  .region-tabs{
    display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;
    scrollbar-width:thin;
  }
  .region-tabs::-webkit-scrollbar{height:6px;}
  .region-tabs::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px;}
  .region-tab{
    flex:0 0 auto;
    padding:8px 14px;border:1px solid var(--border);background:var(--surface);
    border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text-2);
    display:flex;align-items:center;gap:8px;white-space:nowrap;
    transition:all .15s ease;
  }
  .region-tab:hover{border-color:var(--border-strong);color:var(--text);}
  .region-tab.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-d);}
  .region-tab .rcnt{
    font-size:10.5px;font-weight:700;background:var(--gray-bg);color:var(--text-2);
    border-radius:9px;padding:0 6px;min-width:18px;text-align:center;
  }
  .region-tab.active .rcnt{background:#fff;color:var(--accent-d);}
  .region-tab.draggable{cursor:grab;}
  .region-tab.dragging{opacity:.4;}
  .region-tab.drag-over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);background:var(--accent-soft);}
  .oa-sel{height:30px!important;padding:0 8px;font-size:12px;}

  /* Status tabs */
  .status-tabs{display:flex;gap:0;margin:14px 0 14px;border:1px solid var(--border);background:var(--surface);border-radius:10px;overflow:hidden;width:fit-content;box-shadow:var(--shadow);}
  .status-tab{
    padding:10px 18px;font-size:12.5px;font-weight:600;color:var(--text-2);
    border:none;background:none;border-right:1px solid var(--border);
    display:flex;align-items:center;gap:8px;position:relative;
  }
  .status-tab:last-child{border-right:none;}
  .status-tab:hover{background:var(--surface-2);}
  .status-tab.active{background:var(--surface-2);color:var(--text);}
  .status-tab.active::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);}
  .status-tab .scnt{font-size:11px;font-weight:700;border-radius:9px;padding:0 7px;background:var(--gray-bg);color:var(--text-2);}
  .status-tab .pip{width:7px;height:7px;border-radius:50%;}

  /* Toolbar */
  .toolbar{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;
    box-shadow:var(--shadow);margin-bottom:12px;
  }
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.2px;}
  .fitem{display:flex;align-items:center;gap:8px;}
  .fitem>label{font-size:12.5px;color:var(--text-2);font-weight:500;white-space:nowrap;}
  .fitem .sep{color:var(--text-3);padding:0 2px;}
  .actionbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .btn.danger-o{border-color:#f0c4be;color:var(--red);}
  .btn.danger-o:hover{background:var(--red-bg);border-color:var(--red);color:var(--red);}
  .gear{width:15px;height:15px;flex:0 0 auto;}
  .ms{position:relative;}
  .ms-btn{
    min-width:150px;height:34px;padding:0 10px;border:1px solid var(--border-strong);
    background:var(--surface);border-radius:8px;font-size:12.5px;color:var(--text);
    display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:500;
    box-sizing:border-box;
  }
  .ms-btn svg{width:14px;height:14px;flex:0 0 auto;}
  .ms-btn:hover{border-color:var(--accent);}
  .ms-btn .chev{transition:transform .15s;color:var(--text-3);}
  .ms-trigger{min-width:auto;width:auto;justify-content:flex-start;gap:6px;}
  .ms.open .ms-btn .chev{transform:rotate(180deg);}
  .ms-panel{
    position:absolute;top:38px;left:0;z-index:40;min-width:190px;
    background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;
    box-shadow:var(--shadow-pop);padding:6px;display:none;max-height:280px;overflow:auto;
  }
  .ms.open .ms-panel{display:block;}
  .ms-opt{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;font-size:12.5px;cursor:pointer;}
  .ms-opt:hover{background:var(--surface-2);}
  .ms-opt input{width:15px;height:15px;accent-color:var(--accent);}
  .ms-foot{display:flex;justify-content:space-between;padding:6px 8px;border-top:1px solid var(--border);margin-top:4px;}
  .ms-foot button{background:none;border:none;color:var(--accent-d);font-size:12px;font-weight:600;padding:4px;}

  select.inp,input.inp{
    height:34px;border:1px solid var(--border-strong);background:var(--surface);
    border-radius:8px;font-size:12.5px;color:var(--text);padding:0 10px;font-family:inherit;
  }
  input.inp{min-width:200px;}
  select.inp:focus,input.inp:focus,.ms-btn:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}
  .btn{
    height:34px;padding:0 14px;border-radius:8px;font-size:12.5px;font-weight:600;
    border:1px solid var(--border-strong);background:var(--surface);color:var(--text);
    display:inline-flex;align-items:center;gap:6px;transition:all .15s;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent-d);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{background:var(--accent-d);color:#fff;}
  .btn.danger{background:var(--red);border-color:var(--red);color:#fff;}
  .btn.danger:hover{background:#a93226;color:#fff;}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--text-2);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .spacer{flex:1;}

  /* Selection info */
  .sel-info{font-size:12.5px;font-weight:600;color:var(--text-2);}
  .sel-info b{font-size:14px;color:var(--accent-d);}

  /* Table */
  .table-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;min-width:1180px;}
  thead th{
    background:var(--surface-2);text-align:left;font-size:11.5px;font-weight:650;color:var(--text-2);
    padding:11px 12px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;
  }
  tbody td{padding:11px 12px;border-bottom:1px solid var(--border);font-size:12.5px;vertical-align:middle;white-space:nowrap;}
  tbody tr:hover{background:#fbfcfd;}
  tbody tr:last-child td{border-bottom:none;}
  .mname{font-weight:650;color:var(--text);}
  .mid{font-size:11px;color:var(--text-3);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .chk{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;}
  .countries{display:flex;flex-wrap:wrap;gap:4px;}
  .ctag{font-size:10.5px;background:var(--gray-bg);color:var(--text-2);border-radius:5px;padding:1px 6px;font-weight:600;}
  .ctag.cur{background:var(--accent-soft);color:var(--accent-d);}
  .badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;}
  .badge .pip{width:6px;height:6px;border-radius:50%;}
  .b-wait{color:var(--amber);background:var(--amber-bg);}
  .b-deploy{color:var(--blue);background:var(--blue-bg);}
  .b-done{color:var(--green);background:var(--green-bg);}
  .b-off{color:var(--gray);background:var(--gray-bg);}
  .b-reject{color:var(--red);background:var(--red-bg);}
  .rev-safe{color:var(--green);font-weight:600;}
  .rev-risk{color:var(--red);font-weight:600;}
  .risk-tag{font-size:11px;color:var(--red);background:var(--red-bg);border-radius:5px;padding:1px 6px;font-weight:600;max-width:180px;overflow:hidden;text-overflow:ellipsis;}
  .risk-none{color:var(--text-3);}
  .prio{font-weight:700;color:var(--text);}
  .ops{display:flex;gap:6px;}
  .op{
    height:28px;padding:0 10px;border-radius:7px;font-size:11.5px;font-weight:600;
    border:1px solid #c9def5;background:#f2f8ff;color:var(--blue);
    display:inline-flex;align-items:center;gap:5px;
  }
  .op:hover{border-color:var(--blue);background:#e3effc;color:#155a92;}
  .op.go{color:#fff;background:var(--blue);border-color:var(--blue);}
  .op.go:hover{background:#155a92;border-color:#155a92;}
  .op.off{color:var(--blue);border-color:#c9def5;}
  .op.off:hover{background:#e3effc;}
  .op.rec{color:var(--blue);}
  .op svg{width:14px;height:14px;}
  .btn svg{width:16px;height:16px;flex:0 0 auto;}
  .archived-note{color:var(--text-3);font-size:11.5px;}

  /* 扳手图标按钮 + 自定义配置弹窗 */
  .icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;}
  .icon-btn:hover{border-color:var(--blue);color:var(--blue);background:#f2f8ff;}
  .icon-btn svg{width:16px;height:16px;}
  .cfg-body{padding:14px 20px 4px;display:flex;flex-direction:column;gap:14px;max-height:420px;overflow-y:auto;}
  .cfg-row{display:flex;align-items:flex-start;gap:14px;}
  .cfg-cat{width:76px;flex:0 0 76px;font-weight:650;font-size:12.5px;color:var(--text);padding-top:7px;}
  .cfg-row .ms{flex:1;}
  .cfg-logic{flex:0 0 200px;}
  .seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;}
  .seg-btn{height:32px;padding:0 12px;font-size:12px;font-weight:600;border:none;background:var(--surface);color:var(--text-2);}
  .seg-btn.active{background:var(--blue);color:#fff;}
  .cfg-hint{font-size:11px;color:var(--text-3);margin-top:5px;}

  /* 上线弹窗 radio */
  .radio-card{margin:2px 26px 14px;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .radio-line{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;}
  .radio-line:last-child{border-bottom:none;}
  .radio-line:hover{background:var(--surface-2);}
  .radio-line input{margin-top:3px;accent-color:var(--blue);}
  .radio-line small{display:block;color:var(--text-3);font-size:11.5px;margin-top:2px;}

  /* Pagination */
  .pager{display:flex;align-items:center;gap:14px;padding:12px 14px;border-top:1px solid var(--border);flex-wrap:wrap;}
  .pager .info{font-size:12px;color:var(--text-2);}
  .pager .pages{display:flex;gap:4px;margin-left:auto;}
  .pg{min-width:32px;height:32px;border:1px solid var(--border-strong);background:var(--surface);border-radius:7px;font-size:12.5px;color:var(--text-2);font-weight:600;}
  .pg:hover{border-color:var(--accent);color:var(--accent-d);}
  .pg.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .pg:disabled{opacity:.4;cursor:not-allowed;}
  .pager select.inp{height:32px;}

  /* Records view */
  .records-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .legend{background:#fff8ec;border:1px solid #f3e2bf;color:#8a6d2f;border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start;}
  .legend svg{width:15px;height:15px;flex:0 0 auto;margin-top:1px;}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;align-items:center;justify-content:center;z-index:100;}
  .overlay.open{display:flex;}
  .modal{background:var(--surface);border-radius:14px;width:420px;max-width:92vw;box-shadow:var(--shadow-pop);overflow:hidden;}
  .modal h3{margin:0;padding:18px 20px 4px;font-size:15px;}
  .modal p{padding:0 20px 8px;color:var(--text-2);font-size:13px;margin:6px 0;}
  .modal .actions{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px 18px;}
  .modal .warn-ico{width:40px;height:40px;border-radius:50%;background:var(--red-bg);color:var(--red);display:flex;align-items:center;justify-content:center;margin:18px auto 4px;}
  .modal .warn-ico svg{width:22px;height:22px;}
  .modal.wide{width:1080px;max-width:96vw;}
  .am-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 2px;}
  .am-head h3{margin:0;padding:0;font-size:15px;}
  .am-close{width:28px;height:28px;border:none;background:transparent;border-radius:6px;color:var(--text-3);font-size:15px;cursor:pointer;}
  .am-close:hover{background:var(--surface-2);color:var(--text);}
  .am-filters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 16px;padding:8px 20px 0;}
  .am-fitem{display:flex;flex-direction:column;gap:4px;min-width:0;}
  .am-fitem>label{font-size:11.5px;color:var(--text-2);}
  .am-fitem .inp{width:100%;min-width:0;}
  .am-btns{display:flex;gap:8px;padding:12px 20px 0;}
  .am-count{padding:10px 20px 2px;font-size:12px;color:var(--text-2);}
  .am-count b{color:var(--accent-d);}
  .am-table-wrap{max-height:340px;overflow:auto;margin:8px 20px 0;border:1px solid var(--border);border-radius:8px;}
  .am-table-wrap table{width:100%;border-collapse:collapse;font-size:12px;}
  .am-table-wrap th{position:sticky;top:0;background:var(--surface-2);text-align:left;padding:8px 10px;font-weight:600;color:var(--text-2);border-bottom:1px solid var(--border);white-space:nowrap;z-index:1;}
  .am-table-wrap td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
  .am-table-wrap tbody tr:hover td{background:var(--surface-2);}
  .am-table-wrap tr.dup td{color:var(--text-3);}
  .am-table-wrap tr.dup .mname{color:var(--text-3);font-weight:500;}
  .am-table-wrap .mname{color:var(--blue);}
  .am-pager{display:flex;align-items:center;gap:10px;padding:10px 20px 0;font-size:12px;color:var(--text-2);}
  .am-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 16px;}
  .am-foot b{color:var(--accent-d);}
  .am-foot-btns{display:flex;gap:10px;}
  .play-box{width:100%;}
  .play-tags{display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-height:34px;border:1px solid var(--border-strong);border-radius:8px;padding:3px 8px;background:var(--surface);}
  .ptag{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent-d);border-radius:5px;padding:1px 6px;font-size:11.5px;font-weight:600;}
  .ptag-x{cursor:pointer;font-weight:700;}
  .ptag-add{cursor:pointer;color:var(--text-3);font-size:11px;margin-left:auto;font-weight:400;}
  .ph{color:var(--text-3);font-size:12px;}

  /* Toast */
  .toasts{position:fixed;right:22px;bottom:22px;z-index:200;display:flex;flex-direction:column;gap:10px;}
  .toast{background:#1f2733;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-pop);display:flex;align-items:center;gap:9px;animation:slidein .25s ease;max-width:360px;}
  .toast .tico{width:18px;height:18px;flex:0 0 auto;}
  .toast.ok .tico{color:#4ade80;}
  .toast.info .tico{color:#5eead4;}
  @keyframes slidein{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  .empty{padding:48px 20px;text-align:center;color:var(--text-3);font-size:13px;}
  .empty svg{width:42px;height:42px;opacity:.4;margin-bottom:10px;}

  .summary-cards{display:flex;gap:12px;margin:4px 0 16px;flex-wrap:wrap;}
  .scard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;box-shadow:var(--shadow);min-width:130px;}
  .scard .v{font-size:20px;font-weight:700;color:var(--text);}
  .scard .l{font-size:11.5px;color:var(--text-3);margin-top:2px;}
  @media (max-width:780px){.content{padding:14px;}.toolbar{gap:8px;}}

  /* ---------- Sidebar ---------- */
  .shell{display:flex;min-height:100vh;}
  .side{
    width:216px;flex:0 0 216px;background:#0a1c2e;color:#b8c4d0;
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
    overflow-y:auto;padding-bottom:24px;
  }
  .side::-webkit-scrollbar{width:6px;}
  .side::-webkit-scrollbar-thumb{background:#23384e;border-radius:3px;}
  .side-brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;color:#fff;font-size:16px;font-weight:700;letter-spacing:.5px;}
  .sitem{
    display:flex;align-items:center;gap:11px;width:100%;padding:11px 16px;
    border:none;background:none;color:#a7b5c2;font-size:13.5px;font-weight:500;
    text-align:left;font-family:inherit;cursor:pointer;
  }
  .sitem svg{width:17px;height:17px;flex:0 0 auto;}
  .sitem:hover{color:#fff;background:rgba(255,255,255,.05);}
  .sitem.active{background:#2f81f7;color:#fff;}
  .sitem.group{font-weight:600;color:#cdd8e2;}
  .sitem.sub{padding-left:44px;background:rgba(255,255,255,.02);}
  .sitem.sub:hover{background:rgba(255,255,255,.06);}

  </div>
</div>

</div>
<div class="toasts" id="toasts"></div>

<script>
/* ---------- Utilities ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng=mulberry32(20261021);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a){return a[Math.floor(rng()*a.length)];}
function randomId(){const c='0123456789abcdef';let s='';for(let i=0;i<24;i++)s+=c[Math.floor(rng()*16)];return s;}
function randomDate(){const start=new Date('2024-01-01').getTime();const end=new Date('2024-09-30').getTime();return new Date(start+rng()*(end-start)).toISOString().slice(0,10);}
function now(){const d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}
function pastDateTime(){const d=new Date(Date.now()-Math.floor(rng()*60)*86400000-Math.floor(rng()*86400000));const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}

/* ---------- Constants ---------- */
const REGIONS=['US','AU','UK','IN','FR','DE','IT','BE','LATAM(除BR)','BR','ES','PH','VN','TH','ID','MENA','其它国家','LAE'];
const LANGS=['英语','中文','德语','法语','西班牙语','葡萄牙语','意大利语','印地语','日语','韩语','泰语','越南语','印尼语','阿拉伯语','荷兰语','他加禄语'];
const SUBS=['中文','英文','西班牙语','法语','德语','日语','葡萄牙语','无'];
const CATS=['电影','剧集','纪录片','动画','综艺','短剧'];
const PROVIDERS=['Destinations','One World Digital','Breaking Glass Pictures','BMG','Starlight Media','GlobalPix','CineWave','Mango TV'];
const GENRES=['romance','drama','thriller','kids','animation','comedy','action','documentary','sci-fi'];
const PAYTYPES=['免费','VIP','单片付费'];
const OPERATORS=['张敏','李强','王芳','刘洋','陈静','赵磊'];
const STATUS_PIP={'待打标':'var(--amber)','待部署':'var(--blue)','已部署':'var(--green)','已下线':'var(--gray)','不予上线':'var(--red)'};
const REGION_LANG={'US':['英语'],'AU':['英语'],'UK':['英语'],'IN':['印地语','英语'],'FR':['法语'],'DE':['德语'],'IT':['意大利语'],'BE':['法语','荷兰语'],'LATAM(除BR)':['西班牙语','葡萄牙语'],'BR':['葡萄牙语'],'ES':['西班牙语'],'PH':['英语','他加禄语'],'VN':['越南语'],'TH':['泰语'],'ID':['印尼语'],'MENA':['阿拉伯语'],'其它国家':['英语'],'LAE':['西班牙语']};

/* ---------- 自动化工作台 constants ---------- */
const AUTO_CATS=['Movies','TV Series','Live'];
const AUTO_PLAY=['URL','DEEPLINK','WEBURL'];
const AUTO_REVIEW=['安全','敏感'];
const AUTO_PROVIDERS=['Plex AVOD','filmHub','ITN Studios','Allrites','Tubi','Adrise','GlobalPix'];
const AUTO_MS_MAP={autoDeploy:'deploy',autoLang:'langs',autoSub:'subs',autoReview:'review',autoCat:'cats',autoPlay:'play'};
/* 自定义配置：参与聚合的标签类别（Genre / Subgenre / Topic / Element / Feel） */
const CFG_CATS=['Genre','Subgenre','Topic','Element','Feel'];
/* 标准标签池：[标签, 标签类别]（Genre Type / Subgenre / Topic / Element / Feel） */
const TAG_POOL=[
  ['犯罪','Genre'],['浪漫','Genre'],['喜剧','Genre'],['动作','Genre'],['恐怖','Genre'],['科幻','Genre'],['动画','Genre'],['冒险','Genre'],['剧情','Genre'],['奇幻','Genre'],
  ['丧尸','Subgenre'],['赛博朋克','Subgenre'],['宫廷','Subgenre'],['校园','Subgenre'],['末世求生','Subgenre'],['谍战','Subgenre'],
  ['大女主复仇','Topic'],['小人物逆袭','Topic'],['家族恩怨','Topic'],['侦探破案','Topic'],['时间循环','Topic'],
  ['LGBT','Element'],['双生替身','Element'],['重生逆袭','Element'],
  ['治愈','Feel'],['高燃','Feel'],['烧脑','Feel'],['甜宠','Feel'],['催泪','Feel']
];
/* 自动化栏目池（每日刷新模拟）：每个地区生成若干待确认栏目 */
const AUTO_COLUMNS=[];
REGIONS.forEach(rg=>{
  const tags=shuffle(TAG_POOL).slice(0,5);
  tags.forEach((t,i)=>{
    const st=i<3?'待确认':(rng()<0.5?'已上线':'已忽略');
    AUTO_COLUMNS.push({
      id:randomId(),region:rg,tag:t[0],type:t[1],
      count:7+Math.floor(rng()*194),st,
      uvClick:1000+Math.floor(rng()*99000),
      uvPlay:500+Math.floor(rng()*66000),
      time:pastDateTime()
    });
  });
});

/* OA account (simulated logged-in account; region tab order is remembered per account) */
const OA_ACCOUNTS=[{id:'zhangmin',name:'张敏'},{id:'liqiang',name:'李强'},{id:'wangfang',name:'王芳'}];
let OA_USER='zhangmin';
try{const s=localStorage.getItem('autoLaunch.oaUser');if(s&&OA_ACCOUNTS.some(o=>o.id===s))OA_USER=s;}catch(e){}
function oaName(id){const o=OA_ACCOUNTS.find(x=>x.id===id);return o?o.name:id;}
function oaInitial(){const n=oaName(OA_USER);return n?n[0]:'?';}
function regionOrderKey(){return 'autoLaunch.regionOrder.'+OA_USER;}
function getRegionOrder(){
  try{const raw=localStorage.getItem(regionOrderKey());if(raw){const arr=JSON.parse(raw);if(Array.isArray(arr)&&arr.length===REGIONS.length&&arr.every(r=>REGIONS.includes(r))&&new Set(arr).size===REGIONS.length)return arr;}}catch(e){}
  return REGIONS.slice();
}
function setRegionOrder(arr){try{localStorage.setItem(regionOrderKey(),JSON.stringify(arr));}catch(e){}}
let dragRg=null;

/* ---------- Data generation ---------- */
const NAMES=['AGONY IN LOVE','Harambe','Girl Lost: A Hollywood Story','The Little Witch','Rally Caps','Dark Valley','Summer Romance','Midnight Echo','Crimson Tide','Lost Horizon','Neon Shadows','The Last Voyage','Silent Witness','Broken Chains','Eternal Flame','Urban Legend','Phantom Ride','Golden Hour','Cold Case','Dreamcatcher','Iron Will','Northern Lights','The Silent Sea','Paper Moon','Velvet Storm','Echoes of Time','The Forgotten','Shattered Glass','Wild Heart','Quiet Storm','Last Train Home','The Negotiator','Hidden Truth','Burning Sky','Frozen Lake','The Collector','Distant Stars','Rising Sun','Crimson Peak','The Wanderer','Nightfall','Solar Flare','The Archivist','Broken Mirror','Final Curtain','Glass House','The Outsider','Thunder Road','Whispering Pines','Coastal Drift','Fallen Star','The Long Way','Blue Monday','Scarlet Letter','Open Window','The Third Door','Maple Street','Saltwater','Year of the Dog','Concrete Jungle','The Messenger','Low Tide','Green Lake','Paper Boats','Stone Garden','The Briefcase','Night Owl','Redemption Rd','Frostbitten','The Cartographer','Hollow Point','Moonlit Bay','The Inheritance','Saffron Sky','Tidal Wave','The Lighthouse','Quiet Riot','Broken Arrow','Silver Lining','The Pendulum','Cargo 9','Warm Current','Driftwood','The Confession','Lantern Festival','The Salesman','Patchwork','The Veteran','Glass Canyon','Northern Star','The Interpreter','Slow Burn','The Orchid','Melting Snow','The Outpost','Closed Circuit','The Heirloom'];
function weightedStatus(){const x=rng();if(x<0.45)return'待打标';if(x<0.75)return'待部署';if(x<0.95)return'已部署';return'已下线';}
function langFor(r){const a=REGION_LANG[r]||['英语'];return a[Math.floor(rng()*a.length)];}
function subFor(lang){const n=1+Math.floor(rng()*3);const arr=shuffle(SUBS).slice(0,n);if(rng()<0.3&&!arr.includes('无'))arr[0]='无';return arr.join(',');}

const assets=[];
for(let i=0;i<NAMES.length;i++){
  const nReg=1+Math.floor(rng()*5);
  const chosen=shuffle(REGIONS).slice(0,nReg);
  const statusByRegion={};
  chosen.forEach(r=>{statusByRegion[r]=weightedStatus();});
  const primary=chosen[0];
  assets.push({
    id:randomId(),name:NAMES[i],countries:chosen,
    category:pick(CATS),provider:pick(PROVIDERS),priority:1+Math.floor(rng()*5),
    review:rng()<0.75?'安全':'敏感',
    risk:rng()<0.7?'无':(rng()<0.5?'L2-中度色情低俗':'L1-轻度暴力'),
    inboundDate:randomDate(),payType:pick(PAYTYPES),genre:pick(GENRES),
    language:langFor(primary),subtitle:subFor(langFor(primary)),
    statusByRegion
  });
}
const records=[]; // {id,assetId,name,region,action:'下线',fromStatus,time} — 仅下线归档；不予上线直接释放不进记录；取消上线=从记录移除（不回池）
assets.forEach(a=>{Object.entries(a.statusByRegion).forEach(([r,s])=>{
  if(s==='已下线')records.push({id:randomId(),assetId:a.id,name:a.name,region:r,action:'下线',fromStatus:'已部署',time:pastDateTime(),operator:pick(OPERATORS)});
});});
const assetById=id=>assets.find(a=>a.id===id);

/* ---------- Media library (candidates for 添加媒资) ---------- */
const LIB_LEVELS=['季','电影','系列'];
const PLAY_FORMS=['URL','频道号'];
const LIBRARY=[];
for(let i=0;i<120;i++){
  const base=NAMES[i%NAMES.length];
  const title=i<NAMES.length?base:base+' '+['II','III','Stories','2024','Rewind','Chronicles'][Math.floor(i/NAMES.length)-1];
  let vid='6ad';for(let k=0;k<14;k++)vid+='0123456789abcdef'[Math.floor(rng()*16)];
  LIBRARY.push({
    libId:randomId(),title,videoId:vid,bundleId:'XU'+(100000+Math.floor(rng()*900000)),
    provider:pick(PROVIDERS),deployStatus:rng()<0.6?'待打标':'待部署',
    countries:shuffle(REGIONS).slice(0,1+Math.floor(rng()*5)),
    playForm:pick(PLAY_FORMS),mediaStatus:rng()<0.85?'上线':'下线',
    category:pick(CATS),genre:pick(GENRES),level:pick(LIB_LEVELS),
    language:pick(LANGS),subtitle:subFor('x')
  });
}
function isDup(m){return assets.some(a=>a.name===m.title&&a.statusByRegion[state.region]!==undefined);}

/* ---------- State ---------- */
const state={
  topTab:'pool',region:REGIONS[0],status:'待打标',
  langFilter:new Set(),subFilter:new Set(),
  fId:'',fTitle:'',fCountry:'',fCat:'',fGenre:'',fProvider:'',fReview:'',fPay:'',dateFrom:'',dateTo:'',
  colVis:{id:true,status:true,countries:true,category:true,provider:true,priority:true,review:true,risk:true,inboundDate:true,payType:true,genre:true,language:true,subtitle:true},
  pageSize:20,page:1,selected:new Set(),openMs:null,
  amOpen:false,amPage:1,amSelected:new Set(),
  amTitle:'',amId:'',amProvider:'',amDeploy:'',amCountry:'',amStatus:'',amCat:'',amGenre:'',amLevel:'',amLang:'',amSub:'',amPlay:new Set(),
  recRegion:'',recStatus:'',recId:'',recTitle:'',recAvailCountry:'',recCat:'',recGenre:'',recProvider:'',recReview:'',recPay:'',
  recDateFrom:'',recDateTo:'',recOperator:'',recOnlineDate:'',
  recLangFilter:new Set(),recSubFilter:new Set(),recCountries:new Set(),
  recColVis:{id:true,status:true,fromStatus:true,region:true,operator:true,time:true,countries:false,category:true,provider:true,review:false,inboundDate:false,payType:true,genre:true,language:true,subtitle:false},
  /* 页面级：launch=上新工作台 auto=自动栏目工作台 */
  page:'launch',sideOpen:{rec:true},
  autoRegion:'US',autoStatus:'待确认',autoPage:1,autoSelected:new Set(),autoCfg:{},
  pvCol:null,pvPage:1,
  cfgSel:null
};

/* ---------- Icons ---------- */
const I={
  go:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-7-8-3z"/></svg>',
  ban:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v10"/><path d="M8 11l4 4 4-4"/><path d="M5 19h14"/></svg>',
  undo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l-4-4 4-4"/><path d="M5 10h11a4 4 0 0 1 0 8h-3"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3l-8-14a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  empty:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5"/></svg>',
  gear:'<svg class="gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'
};

/* ---------- Render: top tabs ---------- */
function renderTopTabs(){
  const total=REGIONS.length;
  const recCnt=records.length;
  document.getElementById('topTabs').innerHTML=
    `<button class="top-tab ${state.topTab==='pool'?'active':''}" data-action="top" data-v="pool">上新池 <span class="cnt">${total} 区域</span></button>`+
    `<button class="top-tab ${state.topTab==='records'?'active':''}" data-action="top" data-v="records">上线记录 <span class="cnt">${recCnt}</span></button>`;
  document.getElementById('globalStat').textContent='媒资 '+assets.length+' · 上线记录 '+recCnt;
}

/* ---------- Render: header (OA account switch) ---------- */
function renderHeader(){
  const opts=OA_ACCOUNTS.map(o=>`<option value="${o.id}" ${o.id===OA_USER?'selected':''}>${o.name}（OA）</option>`).join('');
  document.getElementById('headerMeta').innerHTML=
    `<span><span class="dot"></span>全球媒资调度</span>`+
    `<span id="globalStat"></span>`+
    `<select class="inp oa-sel" data-action="oaUser" title="切换登录 OA 账号（国家 tab 的拖动排序按账号独立记忆）">${opts}</select>`+
    `<div class="avatar" title="当前 OA 账号：${oaName(OA_USER)}">${oaInitial()}</div>`;
}

/* ---------- Region tabs (shared order, draggable, per-OA persistence) ---------- */
function regionTabBtn(region,active,cnt,action){
  return `<button class="region-tab draggable ${active?'active':''}" draggable="true" data-action="${action}" data-v="${region}" data-rg="${region}">${region}<span class="rcnt">${cnt}</span></button>`;
}
function renderRegionTabs(forRecords){
  const order=getRegionOrder();
  const label=forRecords
    ? '按国家 / 地区分区查看下线归档记录'
    : '按国家 / 地区分区（分区域独立上新池，单区域处理不影响其他区域同媒资状态）';
  let h='<div class="section-label">'+label+'</div><div class="region-tabs">';
  if(forRecords){
    const allActive=state.recRegion==='';
    h+=`<button class="region-tab ${allActive?'active':''}" data-action="recRegionTab" data-v="">全部<span class="rcnt">${records.length}</span></button>`;
  }
  order.forEach(rg=>{
    const cnt=forRecords?records.filter(x=>x.region===rg).length:assets.filter(a=>['待打标','待部署','已部署'].includes(a.statusByRegion[rg])).length;
    const active=forRecords?(state.recRegion===rg):(rg===state.region);
    h+=regionTabBtn(rg,active,cnt,forRecords?'recRegionTab':'region');
  });
  h+='</div>';
  return h;
}

/* ---------- Render: pool view ---------- */
function statusCount(r,s){return assets.filter(a=>a.statusByRegion[r]===s).length;}

function renderPool(){
  const r=state.region;
  // region tabs (draggable, order persisted per OA account)
  let regionTabs=renderRegionTabs(false);

  // status tabs
  const statuses=['待打标','待部署','已部署'];
  let statusTabs='<div class="status-tabs">';
  statuses.forEach(s=>{
    const cnt=statusCount(r,s);
    statusTabs+=`<button class="status-tab ${s===state.status?'active':''}" data-action="status" data-v="${s}"><span class="pip" style="background:${STATUS_PIP[s]}"></span>${s}<span class="scnt">${cnt}</span></button>`;
  });
  statusTabs+='</div>';

  // filter form (layout per reference screenshot)
  const fStatusSel=`<select class="inp" data-action="fStatus">
    <option value="" ${state.status===''?'selected':''}>全部</option>
    <option value="待打标" ${state.status==='待打标'?'selected':''}>待打标</option>
    <option value="待部署" ${state.status==='待部署'?'selected':''}>待部署</option>
    <option value="已部署" ${state.status==='已部署'?'selected':''}>已部署</option>
  </select>`;
  const toolbar=`
  <div class="toolbar">
    <div class="fitem"><label>媒资ID</label><input class="inp" style="width:190px" data-action="fId" placeholder="请输入媒资ID/BundleID" value="${state.fId}"></div>
    <div class="fitem"><label>媒资标题</label><input class="inp" style="width:190px" data-action="fTitle" placeholder="请输入媒资标题" value="${state.fTitle}"></div>
    <div class="fitem"><label>部署状态</label>${fStatusSel}</div>
    <div class="fitem"><label>可用国家</label><select class="inp" data-action="fCountry">${optHTML(REGIONS,state.fCountry,'全部')}</select></div>
    <div class="fitem"><label>分类</label><select class="inp" data-action="fCat">${optHTML(CATS,state.fCat,'全部')}</select></div>
    <div class="fitem"><label>类型</label><select class="inp" data-action="fGenre">${optHTML(GENRES,state.fGenre,'请选择类型')}</select></div>
    <div class="fitem"><label>内容商</label><select class="inp" data-action="fProvider">${optHTML(PROVIDERS,state.fProvider,'全部')}</select></div>
    <div class="fitem"><label>审核结果</label><select class="inp" data-action="fReview">${optHTML(['安全','敏感'],state.fReview,'全部')}</select></div>
    <div class="fitem"><label>入库时间</label><input type="date" class="inp" data-action="fDateFrom" value="${state.dateFrom}"><span class="sep">~</span><input type="date" class="inp" data-action="fDateTo" value="${state.dateTo}"></div>

/* ---------- Data: rows + filter + pagination ---------- */
function getRows(){
  const r=state.region;
  const POOL=['待打标','待部署','已部署'];
  let rows=assets.filter(a=>state.status===''?POOL.includes(a.statusByRegion[r]):a.statusByRegion[r]===state.status)
    .map(a=>({asset:a,region:r,status:a.statusByRegion[r]}));
  rows=rows.filter(row=>{
    const a=row.asset;if(!a)return false;
    if(state.fId && !a.id.toLowerCase().includes(state.fId.toLowerCase()))return false;
    if(state.fTitle && !a.name.toLowerCase().includes(state.fTitle.toLowerCase()))return false;
    if(state.fCountry && !a.countries.includes(state.fCountry))return false;
    if(state.fCat && a.category!==state.fCat)return false;
    if(state.fGenre && a.genre!==state.fGenre)return false;
    if(state.fProvider && a.provider!==state.fProvider)return false;
    if(state.fReview && a.review!==state.fReview)return false;
    if(state.fPay && a.payType!==state.fPay)return false;
    if(state.dateFrom && a.inboundDate<state.dateFrom)return false;
    if(state.dateTo && a.inboundDate>state.dateTo)return false;
    if(state.langFilter.size&&!state.langFilter.has(a.language))return false;
    if(state.subFilter.size){const subs=(a.subtitle||'').split(',').map(s=>s.trim());if(!subs.some(s=>state.subFilter.has(s)))return false;}
    return true;
  });
  const total=rows.length;
  const ps=state.pageSize;const pages=Math.max(1,Math.ceil(total/ps));
  if(state.page>pages)state.page=pages;
  const start=(state.page-1)*ps;
  return {rows:rows.slice(start,start+ps),total,pages};
}

function badge(s){return `<span class="badge b-${s==='待打标'?'wait':s==='待部署'?'deploy':s==='已部署'?'done':s==='已下线'?'off':'reject'}"><span class="pip" style="background:${STATUS_PIP[s]}"></span>${s}</span>`;}

function cellHTML(k,a,row){
  const r=row.region;
  switch(k){
    case 'id':return `<div class="mname">${a.name}</div><div class="mid">${a.id}</div>`;
    case 'status':return badge(row.status);
    case 'countries':return `<div class="countries">${a.countries.map(c=>`<span class="ctag ${c===r?'cur':''}">${c}</span>`).join('')}</div>`;
    case 'category':return a.category;
    case 'provider':return a.provider;
    case 'priority':return `<span class="prio">${a.priority}</span>`;
    case 'review':return `<span class="${a.review==='安全'?'rev-safe':'rev-risk'}">${a.review}</span>`;
    case 'risk':return a.risk==='无'?'<span class="risk-none">无</span>':`<span class="risk-tag" title="${a.risk}">${a.risk}</span>`;
    case 'inboundDate':return a.inboundDate;
    case 'payType':return `<span class="ctag">${a.payType}</span>`;
    case 'genre':return a.genre;
    case 'language':return a.language;
    case 'subtitle':return a.subtitle;
    default:return '';
  }
}

function renderTable(rows,total){
  const head=['<th style="width:34px"><input type="checkbox" class="chk" data-action="selAll"></th>'];
  COLDEFS.forEach(([k,label])=>{if(state.colVis[k])head.push(`<th>${label}</th>`);});
  head.push('<th style="width:170px">操作</th>');
  const colspan=head.length;
  let body='';
  if(!rows.length){
    body=`<tr><td colspan="${colspan}"><div class="empty">${I.empty}<div>当前筛选条件下暂无媒资</div></div></td></tr>`;
  }else{
    rows.forEach(row=>{
      const a=row.asset;const r=row.region;
      const sel=state.selected.has(a.id)?'checked':'';
      let ops='';
      if(row.status==='待打标'||row.status==='待部署'){
        ops=`<button class="op go" data-action="go" data-id="${a.id}" data-r="${r}">${I.go}上线</button><button class="op off" data-action="reject" data-id="${a.id}" data-r="${r}">${I.ban}不予上线</button>`;
      }else if(row.status==='已部署'){
        ops=`<button class="op off" data-action="down" data-id="${a.id}" data-r="${r}">${I.go}上线</button><button class="op off" data-action="reject" data-id="${a.id}" data-r="${r}">${I.ban}不予上线</button>`;
      }
      let tds=`<td><input type="checkbox" class="chk" data-action="sel" data-id="${a.id}" ${sel}></td>`;
      COLDEFS.forEach(([k])=>{if(state.colVis[k])tds+=`<td>${cellHTML(k,a,row)}</td>`;});
      tds+=`<td><div class="ops">${ops}</div></td>`;
      body+=`<tr>${tds}</tr>`;
    });
  }
  const pager=renderPager(total);
  return `<div class="table-card"><div class="table-wrap"><table><thead><tr>${head.join('')}</tr></thead><tbody>${body}</tbody></table></div>${pager}</div>`;
}

function renderPager(total){
  const ps=state.pageSize;const pages=Math.max(1,Math.ceil(total/ps));const p=state.page;
  let pg=`<button class="pg" data-action="pg" data-v="${p-1}" ${p<=1?'disabled':''}>‹</button>`;
  const win=[];const s=Math.max(1,p-2),e=Math.min(pages,p+2);
  if(s>1){win.push(1);if(s>2)win.push('…');}
  for(let i=s;i<=e;i++)win.push(i);
  if(e<pages){if(e<pages-1)win.push('…');win.push(pages);}
  win.forEach(v=>{if(v==='…')pg+=`<span class="pg" style="border:none;background:none">…</span>`;else pg+=`<button class="pg ${v===p?'active':''}" data-action="pg" data-v="${v}">${v}</button>`;});
  pg+=`<button class="pg" data-action="pg" data-v="${p+1}" ${p>=pages?'disabled':''}>›</button>`;
  return `<div class="pager">
    <span class="info">共 <b>${total}</b> 条 · 每页</span>
    <select class="inp" data-action="pageSize">${[10,20,50,100].map(n=>`<option value="${n}" ${n===ps?'selected':''}>${n} 条/页</option>`).join('')}</select>
    <div class="pages">${pg}</div>
  </div>`;
}

    if(state.recCat && (!a||a.category!==state.recCat))return false;

    if(state.recProvider && (!a||a.provider!==state.recProvider))return false;
    if(state.recReview && (!a||a.review!==state.recReview))return false;
    if(state.recPay && (!a||a.payType!==state.recPay))return false;
    if(state.recDateFrom && (!a||a.inboundDate<state.recDateFrom))return false;
    if(state.recDateTo && (!a||a.inboundDate>state.recDateTo))return false;
    if(state.recOperator && !(x.operator||'').includes(state.recOperator))return false;

/* ---------- Actions ---------- */
function advance(a,r){
  const s=a.statusByRegion[r];
  if(s==='待打标')a.statusByRegion[r]='待部署';
  else if(s==='待部署')a.statusByRegion[r]='已部署';
  else if(s==='已部署'){a.statusByRegion[r]='已下线';records.push({id:randomId(),assetId:a.id,name:a.name,region:r,action:'下线',fromStatus:'已部署',time:now(),operator:'当前用户'});}
}
function reject(a,r){
  // 不予上线：移出上新池并直接释放（不进入上线记录）
  delete a.statusByRegion[r];
}
function cancelOnline(recId){
  // 取消上线：将该媒资从上新媒资包（上线记录）中移除，不回到上新池
  const idx=records.findIndex(x=>x.id===recId);if(idx<0)return;
  records.splice(idx,1);
}

function downloadCSV(){
  try{
    const rows=getRecRows();
    const head=['媒资ID','媒资标题','上线状态','原状态','上线国家/地区','上线人','上线时间','可用国家','分类','内容商','审核结果','入库时间','付费类型','类型','语言','字幕语言'];
    const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
    const lines=[head.map(q).join(',')];
    rows.forEach(rec=>{
      const a=assetById(rec.assetId)||{};
      const status=rec.action==='下线'?'已下线':'不予上线';
      lines.push([rec.assetId,rec.name,status,rec.fromStatus,rec.region,rec.operator||'',rec.time,(a.countries||[]).join('|'),a.category||'',a.provider||'',a.review||'',a.inboundDate||'',a.payType||'',a.genre||'',a.language||'',a.subtitle||''].map(q).join(','));
    });
    const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');
    link.href=url;link.download='上线记录_'+now().replace(/[-: ]/g,'')+'.csv';
    document.body.appendChild(link);link.click();link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast('已导出 '+rows.length+' 条上线记录');
  }catch(err){
    toast('当前预览环境不支持下载，请在浏览器中打开试用','info');
  }
}

function pvSeed(str){let h=1779033703;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return h>>>0;}
function pvRows(col){
  const r2=mulberry32(pvSeed(col.id));
  const n=Math.min(col.count,30);
  const rows=[];
  const p=x=>String(x).padStart(2,'0');
  for(let i=0;i<n;i++){
    const name=NAMES[Math.floor(r2()*NAMES.length)]||('Title '+(i+1));
    let vid='6ad';for(let k=0;k<14;k++)vid+='0123456789abcdef'[Math.floor(r2()*16)];
    const review=r2()<0.6?'安全':'敏感';
    const risk=review==='敏感'?(r2()<0.7?'AE-L2-轻度色情低俗-男女亲热':'AE-L1-轻度暴力'):'';
    const dt=new Date(Date.now()-Math.floor(r2()*400)*86400000);
    rows.push({
      name,vid,
      provider:AUTO_PROVIDERS[Math.floor(r2()*AUTO_PROVIDERS.length)],
      review,risk,
      score:(r2()*95+1).toFixed(14),
      time:dt.getFullYear()+'-'+p(dt.getMonth()+1)+'-'+p(dt.getDate())+' '+p(dt.getHours())+':'+p(dt.getMinutes())+':'+p(dt.getSeconds()),
      hue:Math.floor(r2()*360)
    });
  }
  rows.sort((a,b)=>b.score-a.score); // 排序计算得分降序
  return rows;
}

/* ---------- Event delegation ---------- */
document.addEventListener('click',e=>{
  // close multiselects if open and click outside
  if(!e.target.closest('.ms')){state.openMs=null;document.querySelectorAll('.ms.open').forEach(m=>m.classList.remove('open'));}

  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action, v=el.dataset.v, id=el.dataset.id, r=el.dataset.r, rec=el.dataset.rec, mskey=el.dataset.mskey;

  if(a==='top'){state.topTab=v;render();return;}
  if(a==='region'){state.region=v;state.status='待打标';state.selected.clear();state.page=1;render();return;}
  if(a==='status'){state.status=v;state.selected.clear();state.page=1;render();return;}

  if(a==='msToggle'){state.openMs=(state.openMs===mskey)?null:mskey;if(state.cfgSel){renderCfgModal();}else if(state.amOpen){renderAmModal();}else{render();}return;}
  if(a==='msClear'){
    const map={lang:'langFilter',sub:'subFilter',recLang:'recLangFilter',recSub:'recSubFilter',recCountries:'recCountries'};
    if(map[mskey])state[map[mskey]].clear();
    if(AUTO_MS_MAP[mskey])autoCfgFor(state.autoRegion)[AUTO_MS_MAP[mskey]].clear();
    render();return;
  }
  if(a==='msDone'){state.openMs=null;render();return;}

  if(a==='query'){state.page=1;render();toast('已按当前条件查询');return;}
  if(a==='addMedia'){openAddModal();return;}
  if(a==='reset'){
    state.fId='';state.fTitle='';state.fCountry='';state.fCat='';state.fGenre='';state.fProvider='';state.fReview='';state.fPay='';
    state.dateFrom='';state.dateTo='';
    state.langFilter.clear();state.subFilter.clear();
    state.status='待打标';state.page=1;render();return;
  }

  if(a==='selAll'){
    const {rows}=getRows();
    if(el.checked)rows.forEach(row=>state.selected.add(row.asset.id));
    else rows.forEach(row=>state.selected.delete(row.asset.id));
    render();return;
  }
  if(a==='sel'){if(el.checked)state.selected.add(id);else state.selected.delete(id);const sc=document.getElementById('selCount');if(sc)sc.textContent=state.selected.size;return;}

  if(a==='pg'){const n=+v;if(n>=1){state.page=n;render();}return;}

  if(a==='go'){const asset=assetById(id);advance(asset,r);toast('已上线：'+asset.name+'（'+r+'）');render();return;}
  if(a==='down'){
    const asset=assetById(id);
    openModal(`<div class="warn-ico">${I.warn}</div><h3>确认下线该媒资？</h3><p>下线后「${asset.name}」将从 <b>${r}</b> 上新池自动剔除，仅保留在【上线记录】中。该操作不影响其他区域同媒资的上线状态。</p><div class="actions"><button class="btn" data-action="closeModal">取消</button><button class="btn danger" data-action="confirmDown" data-id="${id}" data-r="${r}">确认下线</button></div>`);
    return;
  }
  if(a==='confirmDown'){const asset=assetById(id);advance(asset,r);closeModal();toast('已下线：'+asset.name+'（'+r+'）已归档至上线记录','info');render();return;}
  if(a==='reject'){
    const asset=assetById(id);
    openModal(`<div class="warn-ico">${I.warn}</div><h3>确认不予上线？</h3><p>「${asset.name}」在 <b>${r}</b> 区域将被移出上新池并直接释放（不进入【上线记录】），不再参与自动上新。</p><div class="actions"><button class="btn" data-action="closeModal">取消</button><button class="btn danger" data-action="confirmReject" data-id="${id}" data-r="${r}">确认不予上线</button></div>`);
    return;
  }
  if(a==='confirmReject'){const asset=assetById(id);reject(asset,r);closeModal();toast('已不予上线：'+asset.name+'（'+r+'），已从页面释放','info');render();return;}
  if(a==='cancelOnline'){const rc=records.find(x=>x.id===rec);cancelOnline(rec);toast('已从上新媒资包移除'+(rc?('：'+rc.name):''),'info');render();return;}

  if(a==='batchGo'){
    const {rows}=getRows();
    const sel=rows.filter(row=>state.selected.has(row.asset.id));
    if(!sel.length){toast('请先选择媒资','info');return;}
    let done=0;
    sel.forEach(row=>{const s=row.asset.statusByRegion[row.region];if(s==='待打标'||s==='待部署'){advance(row.asset,row.region);done++;}});
    state.selected.clear();
    if(done)toast('批量上线完成：'+done+' 项已推进上线流程');
    else toast('所选项中无可上线的媒资（已部署媒资请使用下线）','info');
    render();return;
  }
  if(a==='batchReject'){
    const {rows}=getRows();
    const sel=rows.filter(row=>state.selected.has(row.asset.id));
    if(!sel.length){toast('请先选择媒资','info');return;}
    const ids=sel.map(x=>x.asset.id).join(',');
    openModal(`<div class="warn-ico">${I.warn}</div><h3>批量不予上线</h3><p>即将对 <b>${sel.length}</b> 项媒资执行不予上线，它们将从 <b>${state.region}</b> 上新池移除并直接释放，不会进入【上线记录】，也不再参与自动上新。</p><div class="actions"><button class="btn" data-action="closeModal">取消</button><button class="btn danger" data-action="confirmBatchReject" data-ids="${ids}">确认批量不予上线</button></div>`);
    return;
  }
  if(a==='confirmBatchReject'){
    const ids=(el.dataset.ids||'').split(',');
    let n=0;
    ids.forEach(iid=>{const asset=assetById(iid);if(asset&&asset.statusByRegion[state.region]){reject(asset,state.region);n++;}});
    state.selected.clear();closeModal();toast('批量不予上线完成：'+n+' 项已释放','info');render();return;
  }

  /* ----- 添加媒资 modal ----- */
  if(a==='amSel'){const m=LIBRARY.find(x=>x.libId===id);if(m&&isDup(m))return;if(el.checked)state.amSelected.add(id);else state.amSelected.delete(id);renderAmModal();return;}
  if(a==='amSelAll'){const avail=amRows().filter(m=>!isDup(m));if(el.checked)avail.forEach(m=>state.amSelected.add(m.libId));else avail.forEach(m=>state.amSelected.delete(m.libId));renderAmModal();return;}
  if(a==='amPlayRemove'){state.amPlay.delete(v);renderAmModal();return;}
  if(a==='amQuery'){state.amPage=1;renderAmModal();return;}
  if(a==='amReset'){state.amTitle='';state.amId='';state.amProvider='';state.amDeploy='';state.amCountry='';state.amStatus='';state.amCat='';state.amGenre='';state.amLevel='';state.amLang='';state.amSub='';state.amPlay.clear();state.amPage=1;renderAmModal();return;}
  if(a==='amPg'){
    const pages=Math.max(1,Math.ceil(amRows().length/10));
    if(v==='prev')state.amPage=Math.max(1,state.amPage-1);
    else if(v==='next')state.amPage=Math.min(pages,state.amPage+1);
    renderAmModal();return;
  }
  if(a==='amConfirm'){
    const rg=state.region;let n=0;
    state.amSelected.forEach(lid=>{
      const m=LIBRARY.find(x=>x.libId===lid);if(!m)return;
      if(isDup(m))return;
      assets.push({id:randomId(),name:m.title,countries:m.countries.slice(),category:m.category,provider:m.provider,priority:1+Math.floor(rng()*5),review:rng()<0.75?'安全':'敏感',risk:'无',inboundDate:randomDate(),payType:pick(PAYTYPES),genre:m.genre,language:m.language,subtitle:m.subtitle,playForm:m.playForm,level:m.level,statusByRegion:{[rg]:'待打标'}});
      n++;
    });
    state.amSelected.clear();closeModal();
    toast('已添加 '+n+' 项媒资至 '+rg+' 上新池');
    render();return;
  }

  if(a==='closeModal'){closeModal();return;}

  /* ----- 侧边栏 ----- */
  if(a==='sideNav'){state.page=v;state.autoSelected.clear();state.openMs=null;closeModal();render();return;}
  if(a==='sideGroup'){
    if(v==='rec'){state.sideOpen.rec=!state.sideOpen.rec;render();}
    else toast('原型演示：「'+(SIDE_PLACEHOLDER[v]||v)+'」模块本次未开放','info');
    return;
  }
  if(a==='sideDemo'){toast('原型演示：Dashboard 模块本次未开放','info');return;}

  /* ----- 自动化工作台 ----- */
  if(a==='autoRegionTab'){state.autoRegion=v;state.autoStatus='待确认';state.autoPage=1;state.autoSelected.clear();render();return;}
  if(a==='autoStatusTab'){state.autoStatus=v;state.autoPage=1;state.autoSelected.clear();render();return;}
  if(a==='autoSave'){toast('基础筛选条件已保存，次日栏目池刷新生效');return;}

  if(a==='cfgOpen'){openCfgModal();return;}

    const col=AUTO_COLUMNS.find(c=>c.id===id);
    openModal(`<div class="warn-ico" style="background:var(--accent-soft);color:var(--accent-d)">${I.go}</div><h3>确认上线栏目「${col.tag}」？</h3><p>上线后将自动完成：<br>1. 创建媒资包（${col.count} 项媒资 · ${col.region}）；<br>2. 在 CMS 自动创建对应栏目「${col.tag}」。</p><div class="radio-card">
      <label class="radio-line"><input type="radio" name="subFilterMode" value="keep" checked><span><b>保留全部媒资</b><small>按聚合结果直接生成媒资包</small></span></label>
      <label class="radio-line"><input type="radio" name="subFilterMode" value="drop"><span><b>剔除仅字幕匹配的媒资</b><small>过滤剔除仅字幕匹配的媒资后，生成最终媒资包</small></span></label>
    </div><div class="actions"><button class="btn" data-action="closeModal">取消</button><button class="btn primary" data-action="confirmColGo" data-id="${id}">确认上线</button></div>`);
    return;
  }
  if(a==='confirmColGo'){
    const col=AUTO_COLUMNS.find(c=>c.id===id);
    const modeEl=document.querySelector('input[name="subFilterMode"]:checked');
    const drop=modeEl&&modeEl.value==='drop';
    col.st='已上线';state.autoSelected.delete(id);closeModal();

    render();return;
  }
  if(a==='colIgnore'){const col=AUTO_COLUMNS.find(c=>c.id===id);col.st='已忽略';state.autoSelected.delete(id);toast('已忽略栏目：'+col.tag,'info');render();return;}

  if(a==='recProvider'){state.recProvider=el.value;render();return;}
  if(a==='recReview'){state.recReview=el.value;render();return;}
  if(a==='recPay'){state.recPay=el.value;render();return;}
  if(a==='recDateFrom'){state.recDateFrom=el.value;render();return;}
  if(a==='recDateTo'){state.recDateTo=el.value;render();return;}
  if(a==='recOnlineDate'){state.recOnlineDate=el.value;render();return;}
  if(a==='amProvider'){state.amProvider=el.value;return;}
  if(a==='amDeploy'){state.amDeploy=el.value;return;}
  if(a==='amCountry'){state.amCountry=el.value;return;}
  if(a==='amStatus'){state.amStatus=el.value;return;}
  if(a==='amCat'){state.amCat=el.value;return;}
  if(a==='amGenre'){state.amGenre=el.value;return;}
  if(a==='amLevel'){state.amLevel=el.value;return;}
  if(a==='amLang'){state.amLang=el.value;return;}
  if(a==='amSub'){state.amSub=el.value;return;}
  if(a==='autoCountry'){autoCfgFor(state.autoRegion).country=el.value;return;}
  if(a==='autoMStatus'){autoCfgFor(state.autoRegion).mStatus=el.value;return;}
  if(a==='cfgTag'){const s=state.cfgSel[el.dataset.cat].tags;if(el.checked)s.add(el.value);else s.delete(el.value);renderCfgModal();return;}
  if(a==='ms'){
    const ms=el.dataset.ms;
    if(AUTO_MS_MAP[ms]){const cfg=autoCfgFor(state.autoRegion);const set=cfg[AUTO_MS_MAP[ms]];if(el.checked)set.add(el.value);else set.delete(el.value);return;}
    if(ms==='poolCols'){state.colVis[el.value]=el.checked;render();return;}
    if(ms==='recCols'){state.recColVis[el.value]=el.checked;render();return;}
    if(ms==='amPlay'){if(el.checked)state.amPlay.add(el.value);else state.amPlay.delete(el.value);renderAmModal();return;}
    const map={lang:'langFilter',sub:'subFilter',recLang:'recLangFilter',recSub:'recSubFilter',recCountries:'recCountries'};
    const set=state[map[ms]];
    if(set){if(el.checked)set.add(el.value);else set.delete(el.value);}
    render();return;
  }
});
// debounce text inputs
let st;
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action;
  if(a==='fId'||a==='fTitle'||a==='recId'||a==='recTitle'||a==='recOperator'){
    clearTimeout(st);
    st=setTimeout(()=>{state[a]=el.value;render();},250);
  }
  if(a==='amTitle'||a==='amId'){state[a]=el.value;}
});

function render(){
  renderSidebar();
  renderHeader();
  if(state.page==='auto'){
    document.getElementById('topTabs').style.display='none';
    renderAuto();
  }else{
    document.getElementById('topTabs').style.display='flex';
    renderTopTabs();
    if(state.topTab==='pool')renderPool();else renderRecords();
  }
}

/* ---------- Drag-to-reorder region tabs (persisted per OA account) ---------- */
document.addEventListener('dragstart',e=>{
  const tab=e.target.closest('.region-tab');
  if(!tab||tab.dataset.rg===undefined)return;
  dragRg=tab.dataset.rg;
  tab.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  try{e.dataTransfer.setData('text/plain',dragRg);}catch(_){}
});
document.addEventListener('dragend',e=>{
  const tab=e.target.closest('.region-tab');
  if(tab)tab.classList.remove('dragging');
  document.querySelectorAll('.region-tab.drag-over').forEach(t=>t.classList.remove('drag-over'));
  dragRg=null;
});
document.addEventListener('dragover',e=>{
  const tab=e.target.closest('.region-tab');
  if(!tab||tab.dataset.rg===undefined)return;
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  document.querySelectorAll('.region-tab.drag-over').forEach(t=>t.classList.remove('drag-over'));
  if(tab.dataset.rg!==dragRg)tab.classList.add('drag-over');
});
document.addEventListener('drop',e=>{
  const tab=e.target.closest('.region-tab');
  if(!tab||tab.dataset.rg===undefined)return;
  e.preventDefault();
  const target=tab.dataset.rg;
  if(dragRg&&target&&dragRg!==target){
    const order=getRegionOrder();
    const from=order.indexOf(dragRg);
    const to=order.indexOf(target);
    if(from>=0&&to>=0){
      order.splice(from,1);
      order.splice(to,0,dragRg);
      setRegionOrder(order);
      render();
    }
  }
  tab.classList.remove('drag-over');
});

render();
</script>
